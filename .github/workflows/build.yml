name: Build Dango 1.21.11 Fabric
on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x modern/gradlew
          cd modern
          ./gradlew :1.21.11-fabric:build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DangoMusic-1.21.11-fabric
          path: modern/versions/1.21.11-fabric/build/libs/*.jar
